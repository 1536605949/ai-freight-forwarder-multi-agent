events {}
http { upstream api_upstream { server api:8100; }
 server { listen 80; client_max_body_size 5m;
  location /api/ { proxy_pass http://api_upstream; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Host $host; }
  location /internal/ { proxy_pass http://api_upstream; }
  location /metrics { proxy_pass http://api_upstream/metrics; }
  location /demo/ { alias /usr/share/nginx/html/demo/; try_files $uri $uri/ /demo/index.html; }
  location = / { return 302 /demo/; }
 }}
