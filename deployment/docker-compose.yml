services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: [redis_data:/data]
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["8025:8025"]
  api:
    build: {context: .., dockerfile: Dockerfile}
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}}
    expose: ["8100"]
  worker:
    build: {context: .., dockerfile: Dockerfile}
    command: ["python","-m","worker.scheduler"]
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}}
  nginx:
    image: nginx:1.27-alpine
    ports: ["8088:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../demo_client:/usr/share/nginx/html/demo:ro
    depends_on: [api]
  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9091:9090"]
    volumes: [../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
  grafana:
    image: grafana/grafana:11.5.2
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
volumes: {postgres_data: {}, redis_data: {}}
