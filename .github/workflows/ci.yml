name: ci
on: [push, pull_request]
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v5
   - uses: actions/setup-python@v6
     with: {python-version: '3.12'}
   - run: pip install -r requirements-dev.txt

   # Lint is a gate, not a suggestion. The rule set is declared in pyproject.toml, so this
   # passes on a clean tree and fails on a real defect.
   - name: lint
     run: ruff check app tests worker evaluation scripts

   # Unit + integration suite. Includes the migration drift test (upgrade head == ORM
   # metadata), the state-machine invariant tests, and the eval-harness mutation tests.
   - name: tests
     run: pytest -q

   # Proves the packaging invariant: `agent-framework` must stay out of requirements.txt,
   # or the Docker build and every plain install break.
   - name: packaging invariants
     run: python scripts/verify_package.py

   # SHA256SUMS.txt must validate against the bytes this clone actually received.
   # Regenerating it from Windows working-copy bytes once produced CRLF hashes that
   # failed here for 11 files -- the integrity artifact did not protect the artifact.
   - name: checksums
     run: sha256sum -c SHA256SUMS.txt

   # MANIFEST.txt and SHA256SUMS.txt must describe the tracked file list, and the
   # generator must be the source of truth (catches a hand-edited or stale manifest).
   - name: manifest freshness
     run: python scripts/gen_checksums.py --check

   # The initial migration must actually build a working schema, not just parse.
   - name: migrations
     run: alembic upgrade head

   # The app must import and boot with the default (mock) configuration and no credentials.
   - name: smoke boot
     run: python -c "from app.main import app; print(len(app.routes), 'routes')"
