<!doctype html><html><head><meta charset="utf-8"><title>AI Freight Forwarder</title><style>body{font-family:system-ui;max-width:980px;margin:30px auto;padding:0 20px}input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:7px 0}button{padding:10px 16px}.box{white-space:pre-wrap;border:1px solid #ddd;padding:14px;border-radius:8px;margin-top:10px}</style></head><body><h1>Project 2 — AI Freight Forwarder</h1><p>Demo: inbound inquiry → structured workflow</p><input id="email" value="buyer@example.com"><textarea id="body" rows="5">We need 2x40HQ from Shanghai to Los Angeles, please quote.</textarea><button onclick="go()">提交询价</button><div id="out" class="box">Ready</div><script>async function go(){let r=await fetch('/api/v1/messages/inbound',{method:'POST',headers:{'Content-Type':'application/json','X-Demo-User':'sales001','X-Demo-Tenant':'tenant-demo'},body:JSON.stringify({external_message_id:'web-'+Date.now(),sender_email:email.value,subject:'New ocean freight inquiry',body:body.value})});out.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
